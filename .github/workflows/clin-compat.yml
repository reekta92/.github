name: Clin Compatibility

on:
  workflow_call:
    inputs:
      clin_ref:
        description: "Full Clin commit SHA containing scripts/check_upstream.py"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: clin-compat-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  adapter:
    name: Clin adapter
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: library
          persist-credentials: false
      - name: Validate Clin revision
        env:
          CLIN_REF: ${{ inputs.clin_ref }}
        run: |
          if [[ ! "$CLIN_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::clin_ref must be a full commit SHA'; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: reekta92/clin-rs
          ref: ${{ inputs.clin_ref }}
          path: clin
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clin -> target
          save-if: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
      - name: Check candidate against Clin
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/clin/target
        run: python3 clin/scripts/check_upstream.py library
