name: CI

on:
  workflow_call:
    inputs:
      all_features:
        description: "Test optional integrations as well as default features"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ALL_FEATURES: ${{ inputs.all_features }}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@v2
        with:
          env-vars: ALL_FEATURES
          save-if: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
      - name: Clippy and tests
        run: |
          FEATURES=()
          if [ "$ALL_FEATURES" = true ]; then FEATURES+=(--all-features); fi
          cargo clippy --locked --all-targets "${FEATURES[@]}" -- -D warnings
          # Default cargo test includes doctests; --all-targets would omit them.
          cargo test --locked "${FEATURES[@]}"

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read declared minimum Rust version
        id: msrv
        run: |
          python3 - <<'PY'
          import os, re, tomllib
          from pathlib import Path

          package = tomllib.loads(Path('Cargo.toml').read_text()).get('package', {})
          version = package.get('rust-version')
          if not isinstance(version, str) or not re.fullmatch(r'1\.(0|[1-9][0-9]*)(?:\.(0|[1-9][0-9]*))?', version):
              raise SystemExit('::error::A root package with an explicit rust-version is required')
          if version.count('.') == 1:
              version += '.0'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'toolchain={version}', file=output)
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          env-vars: ALL_FEATURES
          save-if: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
      - name: Check all targets on minimum Rust
        run: |
          FEATURES=()
          if [ "$ALL_FEATURES" = true ]; then FEATURES+=(--all-features); fi
          cargo check --locked --all-targets "${FEATURES[@]}"

  platform:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          env-vars: ALL_FEATURES
          save-if: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
      - name: Native platform tests
        run: |
          FEATURES=()
          if [ "$ALL_FEATURES" = true ]; then FEATURES+=(--all-features); fi
          cargo test --locked "${FEATURES[@]}"

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          env-vars: ALL_FEATURES
          save-if: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
      - name: Verify registry package
        run: |
          cargo package --locked
          if [ "$ALL_FEATURES" = true ]; then cargo package --locked --all-features; fi
      - uses: taiki-e/install-action@v2
        if: ${{ hashFiles('deny.toml') != '' }}
        with:
          tool: cargo-deny
      - name: Verify packaged dependency policy
        if: ${{ hashFiles('deny.toml') != '' }}
        run: |
          python3 - <<'PY'
          import json, os, shutil, subprocess, tarfile, tempfile
          from pathlib import Path

          metadata = json.loads(subprocess.check_output(['cargo', 'metadata', '--locked', '--no-deps', '--format-version', '1']))
          package = next(p for p in metadata['packages'] if Path(p['manifest_path']).resolve() == Path('Cargo.toml').resolve())
          name = f"{package['name']}-{package['version']}"
          archive = Path(metadata['target_directory']) / 'package' / f'{name}.crate'
          policy = Path('deny.toml').resolve()
          with tempfile.TemporaryDirectory(prefix='package-policy-', dir=os.environ['RUNNER_TEMP']) as directory:
              with tarfile.open(archive) as source:
                  source.extractall(directory, filter='data')
              checked = Path(directory) / name
              shutil.copyfile(policy, checked / 'deny.toml')
              subprocess.run(['cargo', 'deny', '--locked', '--all-features', 'check'], cwd=checked, check=True)
          PY

  deny:
    name: Deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --locked --all-features
