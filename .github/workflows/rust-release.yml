name: Release

# Reusable Rust release workflow — template master copy.
# Repositories select crate or application releases in their caller workflow.
# Changelog via git-cliff when cliff.toml exists (plain commit list otherwise).
# LICENSE + README.md are required for binary packaging. Approval uses the
# environment named by RELEASE_APPROVAL_ENVIRONMENT (default release-approval).
# Every job consumes the same local release commit, including dry runs.

on:
  workflow_call:
    secrets:
      BOT_TOKEN:
        description: "Token for protected branch pushes; falls back to GITHUB_TOKEN"
        required: false
      CARGO_REGISTRY_TOKEN:
        required: false
    inputs:
      release_kind:
        description: "crate publishes to crates.io and GitHub; application adds desktop packaging"
        type: string
        default: crate
      BIN_NAME:
        type: string
        default: ""
      PKG_PREFIX:
        type: string
        default: ""
      SMOKE_ARGS:
        type: string
        default: --help
      bump:
        description: "Version increment; existing prereleases continue or graduate"
        type: string
        default: patch
      prerelease:
        type: boolean
        default: false
      prerelease_identifier:
        type: string
        default: rc
      override_version:
        description: "Exact, strictly newer semver; overrides bump and prerelease controls"
        type: string
        default: ""
      target_branch:
        type: string
        default: main
      dry_run:
        description: "Validate and build the candidate without pushing or publishing"
        type: boolean
        default: false
      skip_gates:
        description: "Skip preparation checks; real releases still run required CI and package verification"
        type: boolean
        default: false
      all_features:
        description: "Check all Cargo features, including optional library integrations"
        type: boolean
        default: false
      apt_deps:
        description: "Linux build dependencies, separated by spaces"
        type: string
        default: ""
      build_packages:
        type: boolean
        default: false
      build_appimage:
        type: boolean
        default: false
      build_dmg:
        type: boolean
        default: false
      build_macos_intel:
        type: boolean
        default: false
      build_targets:
        type: string
        default: all
      publish_crates:
        type: boolean
        default: true
      update_docs:
        type: boolean
        default: false
      check_nix:
        type: boolean
        default: false
      create_discussion:
        description: "Requires a BOT_TOKEN with discussion permissions"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  APT_DEPS: ${{ inputs.apt_deps }}
  DISCUSSION_CATEGORY: Announcements
  BIN_NAME: ${{ inputs.BIN_NAME }}
  PKG_PREFIX: ${{ inputs.PKG_PREFIX }}
  SMOKE_ARGS: ${{ inputs.SMOKE_ARGS }}

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Prepare & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.configure.outputs.matrix }}
      base_commit: ${{ steps.configure.outputs.base_commit }}
      new_version: ${{ steps.configure.outputs.new_version }}
      tag: ${{ steps.configure.outputs.tag }}
      prerelease: ${{ steps.configure.outputs.prerelease }}
      crate: ${{ steps.configure.outputs.crate }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/${{ inputs.target_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate inputs and calculate version
        id: configure
        env:
          RELEASE_INPUTS: ${{ toJSON(inputs) }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, tomllib
          from pathlib import Path

          cfg = json.loads(os.environ['RELEASE_INPUTS'])
          def require(condition, message):
              if not condition:
                  raise SystemExit(f'::error::{message}')

          number = r'(0|[1-9][0-9]*)'
          identifier = r'(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          semver = re.compile(rf'{number}\.{number}\.{number}(?:-({identifier}(?:\.{identifier})*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?')
          def parse(version):
              match = semver.fullmatch(version)
              require(match is not None, f'Invalid strict semver: {version!r}')
              major, minor, patch, pre = match.groups()
              suffix = tuple((0, int(p)) if p.isdigit() else (1, p) for p in pre.split('.')) if pre else ()
              return (int(major), int(minor), int(patch), int(pre is None), suffix)

          require(cfg['release_kind'] in ('crate', 'application'), 'release_kind must be crate or application')
          require(cfg['bump'] in ('patch', 'minor', 'major'), 'bump must be patch, minor or major')
          require(cfg['build_targets'] in ('all', 'linux-only'), 'build_targets must be all or linux-only')
          subprocess.run(['git', 'check-ref-format', 'refs/heads/' + cfg['target_branch']], check=True)
          manifest = tomllib.loads(Path('Cargo.toml').read_text())
          package = manifest.get('package', {})
          current = package.get('version')
          require(isinstance(current, str), 'A root package with an explicit version is required')
          old = parse(current)
          major, minor, patch = old[:3]
          base = f'{major}.{minor}.{patch}'
          next_base = {'patch': f'{major}.{minor}.{patch + 1}', 'minor': f'{major}.{minor + 1}.0', 'major': f'{major + 1}.0.0'}[cfg['bump']]
          pre = cfg['prerelease_identifier']
          if cfg['override_version']:
              new = cfg['override_version']
          elif cfg['prerelease']:
              require(re.fullmatch(identifier, pre) is not None, 'prerelease_identifier must be one semver identifier')
              previous = current.split('+', 1)[0].split('-', 1)
              continuation = re.fullmatch(re.escape(pre) + r'\.(0|[1-9][0-9]*)', previous[1]) if len(previous) == 2 else None
              new = f'{base}-{pre}.{int(continuation[1]) + 1}' if continuation else f'{base if len(previous) == 2 else next_base}-{pre}.0'
          else:
              new = base if old[3] == 0 else next_base
          require(parse(new) > old, f'Release version {new} must be newer than {current}')
          tag = 'v' + new
          exists = subprocess.run(['git', 'show-ref', '--verify', '--quiet', 'refs/tags/' + tag]).returncode
          require(exists == 1, f'Tag {tag} already exists or could not be checked')
          application = cfg['release_kind'] == 'application'
          if application or cfg['BIN_NAME'] or cfg['PKG_PREFIX']:
              for key in ('BIN_NAME', 'PKG_PREFIX'):
                  require(re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]*', cfg[key]) is not None, f'{key} is required and must be a safe filename')
              for name in ('LICENSE', 'README.md'):
                  require(Path(name).is_file(), f'{name} is required for packaging')
          if not application:
              require(cfg['publish_crates'], 'crate releases require publish_crates')
              require(not any(cfg[k] for k in ('build_packages', 'build_appimage', 'build_dmg', 'build_macos_intel', 'update_docs', 'create_discussion')), 'crate releases cannot enable application steps')
          if cfg['build_appimage']:
              for name in (f"assets/{cfg['BIN_NAME']}.desktop", f"assets/{cfg['BIN_NAME']}.png"):
                  require(Path(name).is_file(), f'build_appimage requires {name}')
          rows = [
              {'target': 'x86_64-unknown-linux-gnu', 'os': 'ubuntu-22.04', 'pkg': 'tar'},
              {'target': 'aarch64-unknown-linux-gnu', 'os': 'ubuntu-22.04-arm', 'pkg': 'tar'},
          ]
          if cfg['build_targets'] == 'all':
              rows += [
                  {'target': 'x86_64-pc-windows-msvc', 'os': 'windows-latest', 'pkg': 'zip'},
                  {'target': 'aarch64-apple-darwin', 'os': 'macos-latest', 'pkg': 'tar'},
              ]
              if cfg['build_macos_intel']:
                  rows.append({'target': 'x86_64-apple-darwin', 'os': 'macos-15-intel', 'pkg': 'tar'})
          values = dict(matrix=json.dumps({'include': rows}), base_commit=subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), new_version=new, tag=tag, prerelease=str(parse(new)[3] == 0).lower(), crate=package['name'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in values.items():
                  print(f'{key}={value}', file=output)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              print(f"Release candidate: **{package['name']} {new}** ({cfg['release_kind']}).\n\nSource: `{values['base_commit']}`. Dry run: `{cfg['dry_run']}`.", file=summary)
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install build deps
        if: ${{ inputs.apt_deps != '' }}
        run: |
          sudo apt-get update
          read -r -a packages <<< "$APT_DEPS"
          sudo apt-get install -y -- "${packages[@]}"
      - name: Install version and changelog tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit,git-cliff
      - name: Set version without updating dependencies
        env:
          VERSION: ${{ steps.configure.outputs.new_version }}
          CRATE: ${{ steps.configure.outputs.crate }}
        run: |
          cp Cargo.lock "$RUNNER_TEMP/original-Cargo.lock"
          cargo set-version "$VERSION"
          python3 - <<'PY'
          import os, tomllib
          from pathlib import Path
          original = tomllib.loads((Path(os.environ['RUNNER_TEMP']) / 'original-Cargo.lock').read_text())
          for package in original['package']:
              if package['name'] == os.environ['CRATE'] and 'source' not in package:
                  package['version'] = os.environ['VERSION']
          actual = tomllib.loads(Path('Cargo.lock').read_text())
          if original != actual:
              raise SystemExit('::error::Version update changed dependencies; refresh Cargo.lock separately')
          PY
      - name: Generate changelog
        env:
          TAG: ${{ steps.configure.outputs.tag }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          NOTES="$RUNNER_TEMP/RELEASE_NOTES.md"
          if [ -f cliff.toml ]; then
            git cliff --tag "$TAG" -o CHANGELOG.md
            if [ -z "$PREV_TAG" ]; then
              git cliff --tag "$TAG" -o "$NOTES"
            else
              git cliff "${PREV_TAG}..HEAD" --tag "$TAG" -o "$NOTES"
            fi
          else
            echo "No cliff.toml — plain commit-list release notes"
            if [ -z "$PREV_TAG" ]; then
              git log --pretty='- %s' > "$NOTES"
            else
              git log --pretty='- %s' "${PREV_TAG}..HEAD" > "$NOTES"
            fi
          fi
      - name: Add crate installation instructions
        if: ${{ inputs.release_kind == 'crate' }}
        env:
          VERSION: ${{ steps.configure.outputs.new_version }}
          MATRIX: ${{ steps.configure.outputs.matrix }}
          ALL_FEATURES: ${{ inputs.all_features }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          metadata = json.loads(subprocess.check_output(['cargo', 'metadata', '--no-deps', '--format-version', '1'], text=True))
          package = next(p for p in metadata['packages'] if Path(p['manifest_path']).resolve() == Path('Cargo.toml').resolve())
          crate, version, binary = package['name'], os.environ['VERSION'], os.environ['BIN_NAME']
          url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/releases/download/v{version}"
          sections = ['\n## Installation\n']
          if binary:
              if not any(t['name'] == binary and 'bin' in t['kind'] for t in package['targets']):
                  raise SystemExit('::error::BIN_NAME must name a root package binary')
              features = ' --all-features' if os.environ['ALL_FEATURES'] == 'true' else ''
              sections += [f'Install the CLI with Rust:\n\n```sh\ncargo install {crate} --locked --version {version}{features}\n```\n',
                           '### Prebuilt binaries\n\nLinux archives contain the executable at the archive root, plus `LICENSE` and `README.md`.\n\n| Target | Archive |\n| --- | --- |']
              for row in json.loads(os.environ['MATRIX'])['include']:
                  extension = 'zip' if row['pkg'] == 'zip' else 'tar.xz'
                  archive = f"{os.environ['PKG_PREFIX']}-{version}-{row['target']}.{extension}"
                  sections.append(f"| `{row['target']}` | [{archive}]({url}/{archive}) |")
              archive = f"{os.environ['PKG_PREFIX']}-{version}-x86_64-unknown-linux-gnu.tar.xz"
              sections += [f'\nFor Linux x86_64 (choose the ARM64 archive for aarch64):\n\n```sh\ncurl -fLO {url}/{archive}\ncurl -fLO {url}/SHA256SUMS\nsha256sum --check --ignore-missing SHA256SUMS\ntar -xJf {archive}\ninstall -Dm755 {binary} "$HOME/.local/bin/{binary}"\n```\n\nEnsure `$HOME/.local/bin` is on `PATH`.',
                           '\n### AUR maintainers\n\nUse the versioned Linux archives above as `source_x86_64` / `source_aarch64` for binary packages and copy their hashes from `SHA256SUMS` into the corresponding `sha256sums_*` arrays. Install the executable from the archive root into `/usr/bin`. Linux GNU builds require glibc 2.35 or newer. The `.tar.gz` variants contain the same files.']
          library = next((t['name'] for t in package['targets'] if 'lib' in t['kind']), None)
          if library:
              sections += [f'\n### Rust library\n\nAdd to `Cargo.toml`:\n\n```toml\n[dependencies]\n{library} = {{ package = "{crate}", version = "={version}" }}\n```']
          sections.append(f'\nThe attached [{crate}-{version}.crate]({url}/{crate}-{version}.crate) is the Cargo source archive published to crates.io. All attached archives are covered by [SHA256SUMS]({url}/SHA256SUMS).\n')
          with (Path(os.environ['RUNNER_TEMP']) / 'RELEASE_NOTES.md').open('a') as notes:
              notes.write('\n'.join(sections))
          PY
      - name: Create local release commit
        id: commit
        env:
          TAG: ${{ steps.configure.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          if [ -f cliff.toml ]; then git add CHANGELOG.md; fi
          git commit -m "release: $TAG"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Quality gates
        if: ${{ !inputs.skip_gates }}
        env:
          ALL_FEATURES: ${{ inputs.all_features }}
        run: |
          FEATURES=()
          if [ "$ALL_FEATURES" = true ]; then FEATURES+=(--all-features); fi
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets "${FEATURES[@]}" -- -D warnings
          cargo test --locked "${FEATURES[@]}"
      - name: Verify crates.io package
        if: ${{ inputs.publish_crates }}
        env:
          ALL_FEATURES: ${{ inputs.all_features }}
        run: |
          cargo publish --dry-run --locked
          if [ "$ALL_FEATURES" = true ]; then
            cargo publish --dry-run --locked --all-features
          fi
      - name: Install packaged dependency checker
        if: ${{ inputs.publish_crates && hashFiles('deny.toml') != '' }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Verify packaged dependency policy
        if: ${{ inputs.publish_crates && hashFiles('deny.toml') != '' }}
        env:
          CRATE: ${{ steps.configure.outputs.crate }}
          VERSION: ${{ steps.configure.outputs.new_version }}
        run: |
          python3 - <<'PY'
          import os, shutil, subprocess, tarfile, tempfile
          from pathlib import Path

          policy = Path('deny.toml').resolve()
          name = f"{os.environ['CRATE']}-{os.environ['VERSION']}"
          # The publish verifier may consume its temporary archive on newer Cargo.
          subprocess.run(['cargo', 'package', '--locked', '--no-verify'], check=True)
          archive = Path('target/package') / f'{name}.crate'
          with tempfile.TemporaryDirectory(prefix='package-policy-', dir=os.environ['RUNNER_TEMP']) as directory:
              with tarfile.open(archive) as package:
                  package.extractall(directory, filter='data')
              checked = Path(directory) / name
              shutil.copyfile(policy, checked / 'deny.toml')
              subprocess.run(['cargo', 'deny', '--locked', '--all-features', 'check'], cwd=checked, check=True)
          PY
      - uses: cachix/install-nix-action@v31
        if: ${{ inputs.check_nix }}
      - name: Check Nix package
        if: ${{ inputs.check_nix }}
        run: nix build --no-link
      - name: Bundle the validated release commit
        env:
          BASE_COMMIT: ${{ steps.configure.outputs.base_commit }}
        run: git bundle create "$RUNNER_TEMP/release.bundle" HEAD "^$BASE_COMMIT"
      - name: Write required CI helper
        run: |
          cat > "$RUNNER_TEMP/required-ci.sh" <<'SH'
          set -euo pipefail
          git push origin "$RELEASE_COMMIT:refs/heads/$CANDIDATE_BRANCH"
          gh workflow run ci.yml --ref "$CANDIDATE_BRANCH"
          for attempt in {1..30}; do
            CI_RUN=$(gh run list --workflow ci.yml --branch "$CANDIDATE_BRANCH" --event workflow_dispatch --json databaseId,headSha |
              jq -r --arg sha "$RELEASE_COMMIT" 'map(select(.headSha == $sha)) | first | .databaseId // empty')
            if [ -n "$CI_RUN" ]; then break; fi
            sleep 2
          done
          test -n "$CI_RUN" || { echo '::error::Release candidate CI did not start'; exit 1; }
          gh run watch "$CI_RUN" --exit-status --interval 10
          # Dispatched check suites do not satisfy direct-push branch rules.
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN/jobs" \
            --jq '.jobs[] | select(.conclusion == "success") | [.name, .html_url] | @tsv' > "$RUNNER_TEMP/ci-statuses.tsv"
          test -s "$RUNNER_TEMP/ci-statuses.tsv" || { echo '::error::Candidate CI has no successful jobs'; exit 1; }
          while IFS=$'\t' read -r CONTEXT URL; do
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$RELEASE_COMMIT" \
              -f state=success -f context="$CONTEXT" -f target_url="$URL" \
              -f description='Passed on the exact release candidate' > /dev/null
          done < "$RUNNER_TEMP/ci-statuses.tsv"
          SH
      - uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: |
            ${{ runner.temp }}/release.bundle
            ${{ runner.temp }}/RELEASE_NOTES.md
            ${{ runner.temp }}/required-ci.sh
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    if: ${{ inputs.release_kind == 'application' || inputs.BIN_NAME != '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-source
          path: ${{ runner.temp }}/release-source
      - name: Restore validated release commit
        env:
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit_sha }}
        run: |
          git fetch --no-tags "$RUNNER_TEMP/release-source/release.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_COMMIT"
          git checkout --detach "$RELEASE_COMMIT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install build deps (native linux)
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: |
          if [ -n "$APT_DEPS" ]; then
            sudo apt-get update
            read -r -a packages <<< "$APT_DEPS"
            sudo apt-get install -y -- "${packages[@]}"
          fi
      - name: Build
        env:
          ALL_FEATURES: ${{ inputs.all_features }}
        run: |
          FEATURES=()
          if [ "$ALL_FEATURES" = true ]; then FEATURES+=(--all-features); fi
          cargo build --release --locked --bin "$BIN_NAME" --target ${{ matrix.target }} "${FEATURES[@]}"
      - name: Smoke test (native)
        shell: bash
        run: |
          python3 - <<'SMOKE'
          import os, shlex, subprocess
          exe = os.environ['BIN_NAME'] + ('.exe' if os.name == 'nt' else '')
          subprocess.run(['./target/${{ matrix.target }}/release/' + exe, *shlex.split(os.environ['SMOKE_ARGS'])], check=True)
          SMOKE
      - name: Ad-hoc sign macOS binary
        if: ${{ startsWith(matrix.os, 'macos') }}
        run: codesign --force --sign - "target/${{ matrix.target }}/release/$BIN_NAME"
      - name: Package macOS application
        if: ${{ startsWith(matrix.os, 'macos') }}
        shell: bash
        run: |
          set -euo pipefail
          APP="$BIN_NAME.app"
          if [ -d "assets/$APP" ]; then
            cp -R "assets/$APP" "$APP"
            mkdir -p "$APP/Contents/Resources"
            cp "target/${{ matrix.target }}/release/$BIN_NAME" "$APP/Contents/Resources/"
            cp "assets/$BIN_NAME.icns" "$APP/Contents/Resources/"
            chmod +x "$APP/Contents/MacOS/$BIN_NAME"
            VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r --arg root "$GITHUB_WORKSPACE/Cargo.toml" \
              '.packages[] | select(.manifest_path == $root) | .version')
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION%%-*}" "$APP/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${VERSION%%-*}" "$APP/Contents/Info.plist"
            codesign --force --deep --sign - "$APP"
          fi
      - name: Package
        shell: bash
        env:
          RELEASE_KIND: ${{ inputs.release_kind }}
          VERSION: ${{ needs.prepare.outputs.new_version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          EXE="$BIN_NAME"
          [ "${{ matrix.os }}" = "windows-latest" ] && EXE="$BIN_NAME.exe"
          cp "target/${{ matrix.target }}/release/$EXE" .
          FILES=("$EXE" LICENSE README.md)
          for ASSET in assets/icon.svg "assets/$BIN_NAME.desktop" "assets/$BIN_NAME.png" \
            "$BIN_NAME.ico" "assets/$BIN_NAME.icns"; do
            if [ -f "$ASSET" ]; then FILES+=("$ASSET"); fi
          done
          if [ "${{ matrix.os }}" != "windows-latest" ] && [ -d "$BIN_NAME.app" ]; then
            FILES+=("$BIN_NAME.app")
          fi
          PREFIX="$PKG_PREFIX"
          if [ "$RELEASE_KIND" = crate ]; then PREFIX="$PREFIX-$VERSION"; fi
          if [ "${{ matrix.pkg }}" = "zip" ]; then
            7z a "dist/${PREFIX}-${{ matrix.target }}.zip" "${FILES[@]}"
          else
            tar -cJf "dist/${PREFIX}-${{ matrix.target }}.tar.xz" "${FILES[@]}"
            tar -czf "dist/${PREFIX}-${{ matrix.target }}.tar.gz" "${FILES[@]}"
          fi
      - name: Package DMG (macOS)
        if: ${{ inputs.build_dmg && startsWith(matrix.os, 'macos') }}
        run: |
          set -euo pipefail
          mkdir -p dmg_root
          cp "$BIN_NAME" LICENSE README.md dmg_root/
          if [ -d "$BIN_NAME.app" ]; then
            cp -R "$BIN_NAME.app" dmg_root/
          fi
          IMAGE="$RUNNER_TEMP/${PKG_PREFIX}.dmg"
          hdiutil create -volname "$BIN_NAME" -srcfolder dmg_root -ov -format UDRW "$IMAGE"
          if [ -f "assets/$BIN_NAME.icns" ]; then
            MOUNT="$RUNNER_TEMP/${PKG_PREFIX}-volume"
            mkdir -p "$MOUNT"
            hdiutil attach "$IMAGE" -nobrowse -mountpoint "$MOUNT"
            trap 'hdiutil detach "$MOUNT" >/dev/null 2>&1 || true' EXIT
            cp "assets/$BIN_NAME.icns" "$MOUNT/.VolumeIcon.icns"
            SetFile -a C "$MOUNT"
            hdiutil detach "$MOUNT"
            trap - EXIT
          fi
          hdiutil convert "$IMAGE" -format UDZO -ov -o "dist/${PKG_PREFIX}-${{ matrix.target }}.dmg"
      - name: Build packages
        if: ${{ inputs.build_packages && startsWith(matrix.os, 'ubuntu') }}
        run: |
          set -euo pipefail
          cargo install cargo-deb cargo-generate-rpm --locked
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r --arg root "$GITHUB_WORKSPACE/Cargo.toml" \
            '.packages[] | select(.manifest_path == $root) | .version')
          if [[ "$VERSION" == *"-"* ]]; then
            # Debian/RPM dislike '-' in upstream version — use '~' (sorts before release)
            SAFE_VERSION=${VERSION//-/\~}
            cargo deb --no-build --target ${{ matrix.target }} --deb-version "$SAFE_VERSION"
            cargo generate-rpm --target ${{ matrix.target }} --set-metadata "version = '$SAFE_VERSION'"
          else
            cargo deb --no-build --target ${{ matrix.target }}
            cargo generate-rpm --target ${{ matrix.target }}
          fi
          cp "target/${{ matrix.target }}/debian/"*.deb dist/
          cp "target/${{ matrix.target }}/generate-rpm/"*.rpm dist/
      - name: Build AppImage
        if: ${{ inputs.build_appimage && matrix.target == 'x86_64-unknown-linux-gnu' }}
        env:
          VERSION: ${{ needs.prepare.outputs.new_version }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/linuxdeploy.AppImage" https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20240109-1/linuxdeploy-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/linuxdeploy.AppImage"
          "$RUNNER_TEMP/linuxdeploy.AppImage" \
            --appdir AppDir \
            --executable "target/${{ matrix.target }}/release/$BIN_NAME" \
            --desktop-file "assets/$BIN_NAME.desktop" \
            --icon-file "assets/$BIN_NAME.png" \
            --output appimage
          shopt -s nullglob
          images=("$BIN_NAME"*.AppImage)
          test "${#images[@]}" -eq 1
          mv "${images[0]}" "dist/${PKG_PREFIX}-$VERSION-x86_64.AppImage"
      - name: Checksums
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then SUM="sha256sum"; else SUM="shasum -a 256"; fi
          # shellcheck disable=SC2086
          $SUM -- * > "sums-${{ matrix.target }}.txt"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  validate:
    name: Validate Required CI
    needs: [prepare, build]
    if: ${{ always() && !failure() && !cancelled() && needs.prepare.result == 'success' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
      statuses: write
    outputs:
      candidate_branch: ${{ steps.ci.outputs.candidate_branch }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit_sha }}
      CANDIDATE_BRANCH: release-candidate/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_commit }}
      - uses: actions/download-artifact@v4
        with:
          name: release-source
          path: ${{ runner.temp }}/release-source
      - name: Restore validated release commit
        run: |
          git fetch --no-tags "$RUNNER_TEMP/release-source/release.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_COMMIT"
          git checkout --detach "$RELEASE_COMMIT"
      - name: Run required CI on release candidate
        id: ci
        run: |
          bash "$RUNNER_TEMP/release-source/required-ci.sh"
          echo "candidate_branch=$CANDIDATE_BRANCH" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish Validated Release
    needs: [prepare, build, validate]
    if: ${{ always() && !failure() && !cancelled() && needs.validate.result == 'success' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
      statuses: write
    environment:
      name: ${{ vars.RELEASE_APPROVAL_ENVIRONMENT || 'release-approval' }}
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.new_version }}
      CRATE: ${{ needs.prepare.outputs.crate }}
      BASE_COMMIT: ${{ needs.prepare.outputs.base_commit }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit_sha }}
      BRANCH: ${{ inputs.target_branch }}
      CANDIDATE_BRANCH: ${{ needs.validate.outputs.candidate_branch }}
      DOC_BRANCH: release-docs/${{ github.run_id }}-${{ github.run_attempt }}
      GH_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
    steps:
      - name: Require publishing credentials
        env:
          PUBLISH_CRATES: ${{ inputs.publish_crates }}
          CREATE_DISCUSSION: ${{ inputs.create_discussion }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          if [ "$PUBLISH_CRATES" = true ] && [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo '::error::publish_crates requires CARGO_REGISTRY_TOKEN'; exit 1
          fi
          if [ "$CREATE_DISCUSSION" = true ] && [ -z "$BOT_TOKEN" ]; then
            echo '::error::create_discussion requires BOT_TOKEN with discussion permissions'; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_TOKEN || github.token }}
          ref: ${{ needs.prepare.outputs.base_commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-source
          path: ${{ runner.temp }}/release-source
      - name: Restore validated release commit
        run: |
          git fetch --no-tags "$RUNNER_TEMP/release-source/release.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_COMMIT"
          git checkout --detach "$RELEASE_COMMIT"
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ inputs.publish_crates }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ inputs.publish_crates }}
      - name: Check crates.io publication state
        id: registry
        if: ${{ inputs.publish_crates }}
        run: |
          # The exact release commit already passed package verification in prepare.
          cargo package --locked --no-verify
          STATUS=$(curl --silent --show-error --location --retry 3 \
            --user-agent "rust-release-workflow ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY)" \
            --output "$RUNNER_TEMP/crate.json" --write-out '%{http_code}' "https://crates.io/api/v1/crates/$CRATE/$VERSION")
          case "$STATUS" in
            404) echo 'published=false' >> "$GITHUB_OUTPUT" ;;
            200)
              EXPECTED=$(jq -er '.version.checksum' "$RUNNER_TEMP/crate.json")
              ACTUAL=$(sha256sum "target/package/$CRATE-$VERSION.crate" | cut -d' ' -f1)
              if [ "$ACTUAL" != "$EXPECTED" ]; then
                echo '::error::This crate version already exists with different contents'; exit 1
              fi
              echo 'published=true' >> "$GITHUB_OUTPUT"
              ;;
            *) echo "::error::crates.io returned HTTP $STATUS"; exit 1 ;;
          esac
      - uses: actions/download-artifact@v4
        if: ${{ inputs.release_kind == 'application' || inputs.BIN_NAME != '' }}
        with:
          pattern: asset-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true
      - name: Verify collected assets
        env:
          RELEASE_KIND: ${{ inputs.release_kind }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          if [ "$RELEASE_KIND" = crate ]; then
            cp "target/package/$CRATE-$VERSION.crate" "$RUNNER_TEMP/release-assets/"
            (cd "$RUNNER_TEMP/release-assets" && sha256sum "$CRATE-$VERSION.crate" > sums-crate.txt)
          fi
          cd "$RUNNER_TEMP/release-assets"
          cat sums-*.txt > SHA256SUMS
          sha256sum --check SHA256SUMS
          rm sums-*.txt
      - name: Push release commit and immutable tag atomically
        run: |
          EXISTING=$(git ls-remote --tags origin "refs/tags/$TAG")
          if [ -n "$EXISTING" ]; then
            test "${EXISTING%%$'\t'*}" = "$RELEASE_COMMIT" || { echo '::error::Tag points to another commit'; exit 1; }
            echo 'Release commit already pushed by this run; resuming publication.'
          else
            git fetch origin "refs/heads/$BRANCH"
            test "$(git rev-parse FETCH_HEAD)" = "$BASE_COMMIT" || { echo '::error::Target branch changed; start a new release'; exit 1; }
            git merge-base --is-ancestor "$BASE_COMMIT" "$RELEASE_COMMIT"
            git tag "$TAG" "$RELEASE_COMMIT"
            # The lease closes the fetch/push race; the ancestry check forbids rewriting history.
            git push --atomic --force-with-lease="refs/heads/$BRANCH:$BASE_COMMIT" origin "$RELEASE_COMMIT:refs/heads/$BRANCH" "refs/tags/$TAG"
          fi
      - name: Publish crates.io
        if: ${{ inputs.publish_crates && steps.registry.outputs.published != 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --no-verify
      - name: Publish GitHub release
        env:
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          CREATE_DISCUSSION: ${{ inputs.create_discussion }}
        run: |
          EXTRA=()
          if [ "$CREATE_DISCUSSION" = true ]; then
            EXTRA+=(--discussion-category "$DISCUSSION_CATEGORY")
          fi
          if DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            if [ "$DRAFT" = false ]; then
              echo 'Release already published by this run.'
              exit 0
            fi
          else
            gh release create "$TAG" --verify-tag --draft --title "$TAG" \
              --notes-file "$RUNNER_TEMP/release-source/RELEASE_NOTES.md" \
              --prerelease="$PRERELEASE" "${EXTRA[@]}"
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/release-assets/"* --clobber
          gh release edit "$TAG" --draft=false
      - name: Restore target branch for documentation updates
        if: ${{ inputs.update_docs }}
        run: |
          git fetch origin "refs/heads/$BRANCH"
          git merge-base --is-ancestor "$RELEASE_COMMIT" FETCH_HEAD
          git checkout --detach FETCH_HEAD
      - name: Update artifact references
        if: ${{ inputs.update_docs }}
        run: |
          set -euo pipefail
          ASSETS=$(gh release view "$TAG" --json assets)
          DEB_FILE=$(echo "$ASSETS" | jq -r '[.assets[].name | select(endswith("_amd64.deb"))][0] // ""')
          RPM_FILE=$(echo "$ASSETS" | jq -r '[.assets[].name | select(endswith(".x86_64.rpm"))][0] // ""')
          TAR_FILE=$(echo "$ASSETS" | jq -r --arg p "${PKG_PREFIX}" '[.assets[].name | select(startswith($p) and contains("x86_64-unknown-linux-gnu") and endswith(".tar.gz"))][0] // ""')
          DEB_ARM64=$(echo "$ASSETS" | jq -r '[.assets[].name | select(endswith("_arm64.deb"))][0] // ""')
          RPM_AARCH64=$(echo "$ASSETS" | jq -r '[.assets[].name | select(endswith(".aarch64.rpm"))][0] // ""')
          TAR_AARCH64=$(echo "$ASSETS" | jq -r '[.assets[].name | select(endswith("aarch64-unknown-linux-gnu.tar.gz"))][0] // ""')
          APPIMAGE_FILE=$(echo "$ASSETS" | jq -r '[.assets[].name | select(endswith("-x86_64.AppImage"))][0] // ""')
          [ -z "$APPIMAGE_FILE" ] || sed -i -E "s/${PKG_PREFIX}-[0-9a-zA-Z._+~-]*-x86_64\.AppImage/$APPIMAGE_FILE/g" README.md
          [ -z "$DEB_FILE" ]     || sed -i -E "s/${PKG_PREFIX}_[0-9a-zA-Z._~-]*_amd64\.deb/$DEB_FILE/g" README.md
          [ -z "$RPM_FILE" ]     || sed -i -E "s/${PKG_PREFIX}-[0-9a-zA-Z._~-]*\.x86_64\.rpm/$RPM_FILE/g" README.md
          [ -z "$TAR_FILE" ]     || sed -i -E "s/${PKG_PREFIX}-[0-9a-zA-Z._~-]*x86_64[0-9a-zA-Z._~-]*\.tar\.gz/$TAR_FILE/g" README.md
          [ -z "$DEB_ARM64" ]    || sed -i -E "s/${PKG_PREFIX}_[0-9a-zA-Z._~-]*_arm64\.deb/$DEB_ARM64/g" README.md
          [ -z "$RPM_AARCH64" ]  || sed -i -E "s/${PKG_PREFIX}-[0-9a-zA-Z._~-]*\.aarch64\.rpm/$RPM_AARCH64/g" README.md
          [ -z "$TAR_AARCH64" ]  || sed -i -E "s/${PKG_PREFIX}-[0-9a-zA-Z._~-]*aarch64[0-9a-zA-Z._~-]*\.tar\.gz/$TAR_AARCH64/g" README.md
          if [ -f PKGBUILD ]; then
            PKGVER=${VERSION//-/_}
            sed -i "s/^pkgver=.*/pkgver=$PKGVER/" PKGBUILD
            sed -i "s/^pkgrel=.*$/pkgrel=1/" PKGBUILD
            TARBALL_NAME=$(echo "$ASSETS" | jq -r '[.assets[].name | select(contains("x86_64-unknown-linux-gnu") and endswith(".tar.xz"))][0] // ""')
            if [ -n "$TARBALL_NAME" ]; then
              gh release download "$TAG" --pattern "$TARBALL_NAME" --output tarball.tar.xz
              SHA=$(sha256sum tarball.tar.xz | cut -d' ' -f1)
              sed -i "s/^sha256sums=.*/sha256sums=(\"$SHA\")/" PKGBUILD
              sed -i "s|^source=.*|source=(\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$TARBALL_NAME\")|" PKGBUILD
            fi
          fi
      - name: Commit documentation updates
        if: ${{ inputs.update_docs }}
        env:
          RELEASE_CI_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if [ -f PKGBUILD ]; then git add PKGBUILD; fi
          if ! git diff --staged --quiet; then
            git commit -m "release: update versions to $TAG"
            DOC_COMMIT=$(git rev-parse HEAD)
            GH_TOKEN="$RELEASE_CI_TOKEN" RELEASE_COMMIT="$DOC_COMMIT" CANDIDATE_BRANCH="$DOC_BRANCH" \
              bash "$RUNNER_TEMP/release-source/required-ci.sh"
            git push origin "HEAD:refs/heads/$BRANCH"
            git push origin --delete "$DOC_BRANCH"
          fi
      - name: Remove published candidate branch
        run: |
          if [ -n "$(git ls-remote --heads origin "refs/heads/$CANDIDATE_BRANCH")" ]; then
            git push origin --delete "$CANDIDATE_BRANCH"
          fi
