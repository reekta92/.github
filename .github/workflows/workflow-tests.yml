name: Workflow Tests

on:
  push:
    branches: [main, master]
    paths: ['.github/workflows/**', '.github/scripts/**']
  pull_request:
    paths: ['.github/workflows/**', '.github/scripts/**']

permissions:
  contents: read

jobs:
  workflow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Lint workflows
        run: |
          curl -fLsS --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
